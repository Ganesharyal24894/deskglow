<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deskglow effects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 1040px; height: 720px; display: flex; background: {{p.bg}}; font-family: 'IBM Plex Sans', sans-serif; color: {{p.text}}; overflow: hidden">
<dc-import name="Sidebar" active="effects" accent="{{accent}}" theme="{{theme}}" on-toggle-theme="{{toggleTheme}}" hint-size="216px,720px"></dc-import>
<main style="flex-grow: 1; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<h1 style="margin: 0; font-family: Sora, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.02em">Effects</h1>
<div style="font-size: 14px; color: {{p.muted}}">Run on the strip's own controller, so they stay smooth with no PC load.</div>
</div>
<div role="group" aria-label="Filter" style="display: flex; gap: 4px; padding: 4px; background: {{p.inset}}; border: 1px solid {{p.line}}; border-radius: 12px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
</header>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; align-content: start; flex-grow: 1">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="22">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}">
<div style="{{t.preview}}"></div>
<span style="font-size: 13px; font-weight: 500; color: {{p.text}}">{{t.label}}</span>
</button>
</sc-for>
</div>
<section aria-label="Now playing" style="display: flex; align-items: center; gap: 18px; height: 72px; box-sizing: border-box; padding: 0 20px; background: {{p.panel}}; border: 1px solid {{p.line}}; border-radius: 16px">
<div style="{{nowPreview}}"></div>
<div style="display: flex; flex-direction: column; width: 170px">
<span style="font-size: 12px; color: {{p.muted}}">Playing</span>
<span style="font-size: 14px; font-weight: 600">{{nowLabel}}</span>
</div>
<label for="spd" style="font-size: 13px; color: {{p.muted}}">Speed</label>
<input id="spd" type="range" min="1" max="100" value="{{speed}}" onInput="{{setSpeed}}" style="flex-grow: 1; height: 24px; accent-color: {{p.text}}">
<div style="width: 48px; text-align: right; font-family: Sora, sans-serif; font-weight: 600; font-size: 16px">{{speed}}</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","options":["#FFB46E","#5B8CFF","#FF4D8D","#3DDC97"],"default":"#FFB46E"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1040,"height":720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 'fade-colors', filter: 'all', speed: 50, theme: null }; }
  renderVals() {
    const s = this.state;
    const theme = s.theme ?? this.props.theme ?? 'dark';
    const dark = theme === 'dark';
    const PAL = {
      dark: { bg: '#0F0F12', panel: '#17171C', line: '#25252D', sel: '#23232B', inset: '#17171C', segOn: '#2A2A33', segShadow: 'none', text: '#ECECF1', muted: '#A0A0AD', strong: '#FFFFFF', gap: '#0F0F12', fadeBase: '#1A1A1F' },
      light: { bg: '#F4F3EF', panel: '#FFFFFF', line: '#E4E2DC', sel: '#FFFFFF', inset: '#ECEBE6', segOn: '#FFFFFF', segShadow: '0 1px 2px rgba(20,20,30,0.12)', text: '#1A1A1F', muted: '#5E5E69', strong: '#0E0E12', gap: '#E9E8E4', fadeBase: '#E9E8E4' },
    };
    const p = PAL[theme];
    const accent = this.props.accent ?? '#FFB46E';
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(accent.slice(i, i + 2), 16));
    const ink = dark ? accent : 'rgb(' + Math.round(r * 0.55) + ',' + Math.round(g * 0.55) + ',' + Math.round(b * 0.55) + ')';
    const C = { red: '#FF3B30', green: '#34C759', blue: '#1E7BFF', yellow: '#FFD60A', cyan: '#32D7F0', magenta: '#E040FB', white: dark ? '#F2F2F2' : '#CFCFD6' };
    const seven = [C.red, C.yellow, C.green, C.cyan, C.blue, C.magenta, C.white];
    const hard = (cols) => 'linear-gradient(90deg,' + cols.map((c, i) => c + ' ' + (i * 100 / cols.length).toFixed(1) + '% ' + ((i + 1) * 100 / cols.length).toFixed(1) + '%').join(',') + ')';
    const soft = (cols) => 'linear-gradient(90deg,' + cols.join(',') + ')';
    const blink = (cols) => 'linear-gradient(90deg,' + cols.flatMap((c, i) => { const w = 100 / cols.length; const a = i * w; return [c + ' ' + a.toFixed(1) + '% ' + (a + w * 0.55).toFixed(1) + '%', p.gap + ' ' + (a + w * 0.55).toFixed(1) + '% ' + (a + w).toFixed(1) + '%']; }).join(',') + ')';
    const cap = (w) => w[0].toUpperCase() + w.slice(1);
    const defs = [
      ['jump-rgb', 'jump', 'Jump · RGB', hard([C.red, C.green, C.blue])],
      ['jump-colors', 'jump', 'Jump · 7 colours', hard(seven)],
      ['fade-rgb', 'fade', 'Fade · RGB', soft([C.red, C.green, C.blue])],
      ['fade-colors', 'fade', 'Fade · 7 colours', soft(seven)],
    ];
    ['red', 'green', 'blue', 'yellow', 'cyan', 'magenta', 'white'].forEach((c) => defs.push(['fade-' + c, 'fade', 'Fade · ' + cap(c), soft([p.fadeBase, C[c], p.fadeBase])]));
    [['red', 'green'], ['red', 'blue'], ['green', 'blue']].forEach(([a, b2]) => defs.push(['fade-' + a + '-' + b2, 'fade', 'Fade · ' + cap(a) + ' & ' + cap(b2), soft([C[a], C[b2], C[a]])]));
    defs.push(['blink-colors', 'blink', 'Blink · 7 colours', blink(seven)]);
    ['red', 'green', 'blue', 'yellow', 'cyan', 'magenta', 'white'].forEach((c) => defs.push(['blink-' + c, 'blink', 'Blink · ' + cap(c), blink([C[c], C[c], C[c], C[c]])]));
    const bar = (bg, h) => 'height:' + h + 'px;border-radius:' + (h / 2) + 'px;background:' + bg + ';';
    const tiles = defs.filter((d) => s.filter === 'all' || d[1] === s.filter).map(([id, , label, bg]) => ({
      label, pressed: id === s.sel ? 'true' : 'false',
      pick: () => this.setState({ sel: id }),
      preview: bar(bg, 10) + 'width:100%;',
      style: 'display:flex;flex-direction:column;justify-content:center;gap:10px;height:62px;padding:0 14px;border-radius:12px;cursor:pointer;text-align:left;font-family:inherit;' + (id === s.sel ? 'background:' + p.sel + ';border:1px solid ' + ink + ';' : 'background:' + p.panel + ';border:1px solid ' + p.line + ';'),
    }));
    const now = defs.find((d) => d[0] === s.sel);
    const filters = [['all', 'All'], ['fade', 'Fade'], ['jump', 'Jump'], ['blink', 'Blink']].map(([id, label]) => ({
      label, pressed: id === s.filter ? 'true' : 'false',
      pick: () => this.setState({ filter: id }),
      style: 'height:36px;padding:0 14px;border-radius:9px;border:0;cursor:pointer;font:500 13px \'IBM Plex Sans\',sans-serif;' + (id === s.filter ? 'background:' + p.segOn + ';color:' + p.strong + ';box-shadow:' + p.segShadow + ';' : 'background:transparent;color:' + p.muted + ';'),
    }));
    return {
      p, theme, accent, tiles, filters, speed: s.speed, nowLabel: now[2],
      toggleTheme: () => this.setState({ theme: dark ? 'light' : 'dark' }),
      nowPreview: bar(now[3], 14) + 'width:120px;' + (dark ? 'box-shadow:0 0 18px rgba(255,255,255,0.12);' : ''),
      setSpeed: (e) => this.setState({ speed: Number(e.target.value) }),
    };
  }
}
</script>
</body>
</html>
