<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deskglow focus timer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 1040px; height: 720px; display: flex; background: {{p.bg}}; font-family: 'IBM Plex Sans', sans-serif; color: {{p.text}}; overflow: hidden">
<dc-import name="Sidebar" active="focus" accent="#28A0C8" theme="{{theme}}" on-toggle-theme="{{toggleTheme}}" hint-size="216px,720px"></dc-import>
<main style="flex-grow: 1; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: Sora, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.02em">Focus</h1>
<div style="font-size: 14px; color: {{p.muted}}">A Pomodoro timer you can see from the corner of your eye.</div>
</header>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; flex-grow: 1">
<section aria-label="Timer" style="box-sizing: border-box; background: {{p.panel}}; border: 1px solid {{p.line}}; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
<div style="position: relative; width: 300px; height: 300px">
<svg width="300" height="300" viewBox="0 0 300 300" aria-hidden="true">
<circle cx="150" cy="150" r="130" fill="none" stroke="{{p.track}}" stroke-width="14"></circle>
<circle cx="150" cy="150" r="130" fill="none" stroke="#28A0C8" stroke-width="14" stroke-linecap="round" stroke-dasharray="816.8" stroke-dashoffset="202" transform="rotate(-90 150 150)" style="filter: drop-shadow(0 0 10px rgba(40,160,200,0.55))"></circle>
</svg>
<div style="position: absolute; left: 0; top: 0; width: 300px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: {{p.phase}}">FOCUS</div>
<div style="font-family: Sora, sans-serif; font-weight: 600; font-size: 64px; letter-spacing: -0.03em">18:42</div>
<div style="font-size: 14px; color: {{p.muted}}">Round 2 of 4</div>
</div>
</div>
<div style="display: flex; gap: 12px">
<button type="button" style="height: 46px; min-width: 132px; border-radius: 12px; border: 0; cursor: pointer; background: {{p.primary}}; color: {{p.onPrimary}}; font: 600 14px 'IBM Plex Sans', sans-serif">Pause</button>
<button type="button" style="height: 46px; min-width: 132px; border-radius: 12px; cursor: pointer; background: {{p.btn}}; color: {{p.text}}; border: 1px solid {{p.line2}}; font: 600 14px 'IBM Plex Sans', sans-serif">Stop</button>
</div>
</section>
<div style="display: flex; flex-direction: column; gap: 20px">
<section aria-label="Timer settings" style="box-sizing: border-box; padding: 20px; background: {{p.panel}}; border: 1px solid {{p.line}}; border-radius: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: Sora, sans-serif; font-weight: 600; font-size: 15px">Timer</h2>
<sc-for list="{{steppers}}" as="st" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 14px; flex-grow: 1">{{st.label}}</span>
<button type="button" aria-label="Decrease {{st.label}}" style="{{stepStyle}}">−</button>
<span style="width: 64px; text-align: center; font-family: Sora, sans-serif; font-weight: 600; font-size: 15px">{{st.value}}</span>
<button type="button" aria-label="Increase {{st.label}}" style="{{stepStyle}}">+</button>
</div>
</sc-for>
</section>
<section aria-label="Light cues" style="box-sizing: border-box; padding: 20px; background: {{p.panel}}; border: 1px solid {{p.line}}; border-radius: 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
<h2 style="margin: 0; font-family: Sora, sans-serif; font-weight: 600; font-size: 15px">What the light means</h2>
<sc-for list="{{cues}}" as="c" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px">
<div style="{{c.dot}}"></div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 14px; font-weight: 500">{{c.label}}</span>
<span style="font-size: 12px; color: {{p.muted}}">{{c.desc}}</span>
</div>
</div>
</sc-for>
</section>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1040,"height":720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: null }; }
  renderVals() {
    const theme = this.state.theme ?? this.props.theme ?? 'dark';
    const dark = theme === 'dark';
    const PAL = {
      dark: { bg: '#0F0F12', panel: '#17171C', line: '#25252D', btn: '#1F1F26', line2: '#2A2A33', track: '#23232B', text: '#ECECF1', muted: '#A0A0AD', phase: '#5CC6E8', primary: '#28A0C8', onPrimary: '#0B1418' },
      light: { bg: '#F4F3EF', panel: '#FFFFFF', line: '#E4E2DC', btn: '#F2F1ED', line2: '#D6D4CD', track: '#ECEAE5', text: '#1A1A1F', muted: '#5E5E69', phase: '#15708F', primary: '#1C7FA3', onPrimary: '#FFFFFF' },
    };
    const p = PAL[theme];
    const dot = (c) => 'width:28px;height:10px;border-radius:5px;flex-shrink:0;background:' + c + ';box-shadow:0 0 10px ' + c + ';';
    return {
      p, theme,
      toggleTheme: () => this.setState({ theme: dark ? 'light' : 'dark' }),
      stepStyle: 'width:44px;height:44px;border-radius:10px;background:' + p.btn + ';border:1px solid ' + p.line2 + ';color:' + p.text + ';font-size:18px;cursor:pointer;',
      steppers: [{ label: 'Focus', value: '25 min' }, { label: 'Break', value: '5 min' }, { label: 'Rounds', value: '4' }],
      cues: [
        { label: 'Focus', desc: 'Steady calm cyan', dot: dot('#28A0C8') },
        { label: 'Break', desc: 'Soft green', dot: dot('#46B45A') },
        { label: 'Last minute', desc: 'Gently breathes', dot: dot('#5CC6E8') + 'opacity:0.55;' },
        { label: 'Done', desc: 'Settles on lavender', dot: dot('#9682C8') },
      ],
    };
  }
}
</script>
</body>
</html>
