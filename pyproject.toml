[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deskglow"
dynamic = ["version"]
description = "Control cheap Bluetooth LE RGB LED strips (ELK-BLEDOM family): screen bias light, ambient modes, CLI and background daemon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ganesh Sharma" }]
keywords = ["led", "bluetooth", "ble", "elk-bledom", "bias-light", "ambilight", "linux",
            "macos", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "bleak>=0.22",
    "platformdirs>=4.0",
    "tzlocal>=5.0; sys_platform == 'win32'",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
screen = [
    "mss>=9",
    "numpy>=1.23",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]
audio = ["numpy>=1.23", "soundcard>=0.4.3"]
# pynput (global shortcut) is not pulled in on Linux: it needs evdev, which only
# ships as source and must be compiled. `pip install pynput` enables it on X11.
gui = ["PySide6>=6.10", "pynput>=1.7; sys_platform != 'linux'"]
all = ["deskglow[screen,audio,gui]"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mss>=9",
    "numpy>=1.23",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "ruff>=0.5",
    "PySide6>=6.10",
    "pytest-qt>=4.4",
]

[project.urls]
Homepage = "https://github.com/OWNER/deskglow"
Issues = "https://github.com/OWNER/deskglow/issues"

[project.scripts]
deskglow = "deskglow.app.cli:main"
deskglowd = "deskglow.app.daemon:main"

[project.gui-scripts]
deskglow-gui = "deskglow.app.gui:main"

[tool.hatch.version]
path = "deskglow/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["deskglow"]

[tool.hatch.build.targets.sdist]
include = ["deskglow", "presets", "scripts", "tests", "docs", "hatch_build.py",
           "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE"]

# Regenerates deskglow/model/presets_gen.py from presets/ before every build.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not hardware'"
asyncio_mode = "auto"
markers = [
    "hardware: needs a real BLE strip; deselected by default (-m 'not hardware')",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["deskglow"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4", "SIM"]
ignore = ["E501", "SIM105", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
